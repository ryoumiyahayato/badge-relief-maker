[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badge-relief-maker"
version = "0.3.0"
description = "Chinese desktop software for single-image badge and medal grayscale heightmap generation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "scipy>=1.10,<2",
  "trimesh>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gui = ["PySide6>=6.6"]
package = ["PySide6>=6.6", "pyinstaller>=6.10"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "PySide6>=6.6",
  "pyinstaller>=6.10",
]

[project.scripts]
badge-relief-maker = "badge_relief_maker.app.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["badge_relief_maker*"]
exclude = ["tests*", "badge-relief-maker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
# Start with defects that can break imports or execution. Formatting and full
# import-order enforcement should be enabled only after the existing tree is
# normalized in a dedicated change.
select = ["E9", "F63", "F7", "F82"]
