name: Diagnose deterministic workflow patch transport

on:
  push:
    branches:
      - fix/deterministic-grayscale-relief-workflow
    paths:
      - .github/workflows/export-deterministic-workflow-source.yml
  pull_request:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - .github/workflows/export-deterministic-workflow-source.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deterministic-grayscale-relief-workflow
          fetch-depth: 0
      - name: Reassemble transport
        shell: bash
        run: |
          cat tools/deterministic-patch-chunk-* > /tmp/deterministic_workflow_patch.gz.b64
          sha256sum /tmp/deterministic_workflow_patch.gz.b64
          wc -c /tmp/deterministic_workflow_patch.gz.b64
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-workflow-patch-transport
          path: /tmp/deterministic_workflow_patch.gz.b64
          if-no-files-found: error
          retention-days: 1
