name: Apply verified deterministic workflow patch series

on:
  push:
    branches:
      - fix/deterministic-grayscale-relief-workflow
    paths:
      - .github/workflows/export-deterministic-workflow-source.yml
  pull_request:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - .github/workflows/export-deterministic-workflow-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deterministic-grayscale-relief-workflow
          fetch-depth: 0
      - name: Verify and apply patch series
        shell: bash
        run: |
          cat tools/deterministic-patch-chunk-* > /tmp/deterministic_workflow_patch.gz.b64
          actual_sha="$(sha256sum /tmp/deterministic_workflow_patch.gz.b64 | cut -d' ' -f1)"
          echo "transport_sha256=${actual_sha}"
          test "${actual_sha}" = "14ec1f82f5b98d4f66964e2619ca9397cad8d9820f2fb759f1a559772c680f6a"
          base64 --decode /tmp/deterministic_workflow_patch.gz.b64 | gzip --decompress > /tmp/deterministic_workflow_series.patch
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          cat > .github/workflows/export-deterministic-workflow-source.yml <<'BASELINE'
          name: Export deterministic workflow source

          on:
            push:
              branches:
                - fix/deterministic-grayscale-relief-workflow
              paths:
                - .github/workflows/export-deterministic-workflow-source.yml
            pull_request:
              branches:
                - fix/usable-relief-preview-and-mask
              paths:
                - .github/workflows/export-deterministic-workflow-source.yml
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: fix/deterministic-grayscale-relief-workflow
                    fetch-depth: 0
                - name: Pack source tree
                  shell: bash
                  run: tar --exclude=.git -czf /tmp/badge-relief-maker-source.tar.gz .
                - uses: actions/upload-artifact@v4
                  with:
                    name: deterministic-workflow-source
                    path: /tmp/badge-relief-maker-source.tar.gz
                    if-no-files-found: error
                    retention-days: 1
          BASELINE
          git add .github/workflows/export-deterministic-workflow-source.yml
          git commit -m "chore: restore source export workflow before patch application"
          git am /tmp/deterministic_workflow_series.patch
      - name: Remove temporary transport files and push
        shell: bash
        run: |
          git rm tools/deterministic-patch-ready tools/deterministic-patch-chunk-* .github/workflows/apply-deterministic-workflow-patch.yml
          git commit -m "chore: remove temporary patch transport"
          git push origin HEAD:fix/deterministic-grayscale-relief-workflow
