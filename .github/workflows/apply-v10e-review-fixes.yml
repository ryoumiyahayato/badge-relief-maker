name: Apply V10 review fixes

on:
  push:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - tools/v10e_patch_ready.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed V10 patch
        shell: bash
        run: |
          cat tools/v10e_patch_part_* > /tmp/v10e_full.patch
          git apply --check /tmp/v10e_full.patch
          git apply /tmp/v10e_full.patch
          rm tools/v10e_patch_part_* tools/v10e_patch_ready.txt
          rm .github/workflows/apply-v10e-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine boundary roles and smooth sculptural relief"
          git push origin "HEAD:${GITHUB_REF_NAME}"
