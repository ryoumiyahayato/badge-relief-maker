name: Fetch real metal medal fixture

on:
  push:
    branches:
      - fix/deterministic-grayscale-relief-workflow
    paths:
      - .github/workflows/fetch-real-medal-fixture.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deterministic-grayscale-relief-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Download and normalize CC0 fixture
        shell: bash
        run: |
          mkdir -p tests/fixtures /tmp/medal-fixture
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/c/c2/Medal_MET_25348.jpg' \
            --output /tmp/medal-fixture/original.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path('/tmp/medal-fixture/original.jpg')
          target = Path('tests/fixtures/real_metal_badge_photo.jpg')
          with Image.open(source) as image:
              image = ImageOps.exif_transpose(image).convert('RGB')
              image.thumbnail((384, 384), Image.Resampling.LANCZOS)
              image.save(target, format='JPEG', quality=88, optimize=True, progressive=False)
          PY
          cat > tests/fixtures/REAL_METAL_BADGE_PHOTO_LICENSE.md <<'EOF'
          # Real metal badge photo fixture

          - File: `real_metal_badge_photo.jpg`
          - Source: Wikimedia Commons, `File:Medal MET 25348.jpg`
          - Object: Medal (MET accession 83.2.14)
          - Source institution: The Metropolitan Museum of Art
          - License: CC0 1.0 Universal / public-domain dedication
          - Original dimensions: 1910 x 2075 pixels
          - Test copy: resized JPEG used only for offline regression testing
          - Retrieval date: 2026-07-31
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: real-metal-medal-fixture
          path: tests/fixtures/
          if-no-files-found: error
          retention-days: 1
      - name: Commit fixture and remove transport workflow
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add tests/fixtures
          git rm .github/workflows/fetch-real-medal-fixture.yml
          git commit -m "test: add CC0 real metal badge regression fixture"
          git push origin HEAD:fix/deterministic-grayscale-relief-workflow
