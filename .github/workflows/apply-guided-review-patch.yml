name: Apply guided review patch

on:
  push:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - tools/followup_review_patch.gz.b64
      - .github/workflows/apply-guided-review-patch.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply guided review changes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/followup_review_patch.gz.b64 | gzip --decompress > /tmp/guided-review.patch
          git apply --check /tmp/guided-review.patch
          git apply /tmp/guided-review.patch

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify static checks and focused tests
        shell: bash
        run: |
          python -m compileall -q badge_relief_maker tests
          python -m ruff check badge_relief_maker tests
          python -m pytest -q \
            tests/test_semantic_studio.py \
            tests/test_confidence_preview.py \
            tests/test_profile_inspection.py \
            tests/test_lineart_region_graph.py \
            tests/test_single_side_pipeline.py \
            tests/test_cross_quality_visual_edits_v2.py

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm tools/followup_review_patch.gz.b64
          rm .github/workflows/apply-guided-review-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add guided uncertainty and height review"
          git push origin "HEAD:${GITHUB_REF_NAME}"
