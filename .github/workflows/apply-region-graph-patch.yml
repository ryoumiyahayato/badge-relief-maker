name: Apply region graph patch

on:
  push:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - tools/region_graph_remaining.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          git apply --check tools/region_graph_remaining.patch
          git apply tools/region_graph_remaining.patch
          rm tools/region_graph_remaining.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add explicit line-art region roles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
