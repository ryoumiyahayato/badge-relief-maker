name: Export source for review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf badge-relief-maker-source.tar.gz
          sha256sum badge-relief-maker-source.tar.gz > badge-relief-maker-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: badge-relief-maker-source
          path: |
            badge-relief-maker-source.tar.gz
            badge-relief-maker-source.sha256
          if-no-files-found: error
          retention-days: 7
