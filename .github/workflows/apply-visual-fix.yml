name: Apply visual quality fix

on:
  push:
    branches: [fix/usable-relief-preview-and-mask]
    paths:
      - ".github/workflows/apply-visual-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usable-relief-preview-and-mask
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/visual-fix/gzpart*.b64 | base64 -d | gzip -d > /tmp/visual_fix.patch
          git apply --index /tmp/visual_fix.patch
          git rm -r .github/visual-fix
          git rm .github/workflows/apply-visual-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make badge relief previews and masking usable"
          git push origin HEAD:fix/usable-relief-preview-and-mask
