name: Apply manual annotation patch

on:
  push:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - tools/manual_annotation_patch.gz.b64
      - .github/workflows/apply-manual-annotation-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode and apply semantic annotation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/manual_annotation_patch.gz.b64 | gzip --decompress > /tmp/manual-annotation.patch
          git apply --check /tmp/manual-annotation.patch
          git apply /tmp/manual-annotation.patch
          rm tools/manual_annotation_patch.gz.b64
          rm .github/workflows/apply-manual-annotation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add semantic part and brush annotations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
