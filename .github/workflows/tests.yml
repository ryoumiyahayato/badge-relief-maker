name: tests

on:
  push:
  pull_request:

jobs:
  windows-quality-gate:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify package entry point
        run: python -m badge_relief_maker.app
      - name: Verify help entry point
        run: python -m badge_relief_maker.app --help
      - name: Verify GUI module imports
        run: python -c "from badge_relief_maker.app.ui.main_window import MainWindow; print(MainWindow.__name__)"
      - name: Run static checks
        run: python -m ruff check badge_relief_maker tests
      - name: Run tests
        run: python -m pytest -q
