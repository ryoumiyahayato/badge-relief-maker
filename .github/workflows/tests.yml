name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-exporter-compatibility:
    if: github.event_name == 'push' && github.ref_name == 'fix/usable-relief-preview-and-mask' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usable-relief-preview-and-mask
          fetch-depth: 0
      - name: Restore exporter compatibility functions
        shell: python
        run: |
          from pathlib import Path
          path = Path("badge_relief_maker/app/core/mesh_exporter.py")
          text = path.read_text(encoding="utf-8")
          if "def supported_formats():" not in text:
              text += "\n\ndef supported_formats():\n    return {\"stl\", \"obj\", \"glb\"}\n"
          if "def implemented_formats():" not in text:
              text += "\n\ndef implemented_formats():\n    return {\"obj\", \"stl\", \"glb\"}\n"
          path.write_text(text, encoding="utf-8")
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge_relief_maker/app/core/mesh_exporter.py
          git commit -m "fix: restore exporter format compatibility helpers"
          git push origin HEAD:fix/usable-relief-preview-and-mask

  windows-quality-gate:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify package entry point
        run: python -m badge_relief_maker.app
      - name: Verify help entry point
        run: python -m badge_relief_maker.app --help
      - name: Verify version entry point
        run: python -m badge_relief_maker.app --version
      - name: Verify corrected GUI module imports
        run: python -c "from badge_relief_maker.app.ui.editor_window import MainWindow; print(MainWindow.__name__)"
      - name: Run static checks
        run: python -m ruff check badge_relief_maker tests
      - name: Run tests
        run: python -m pytest -q

  windows-package-smoke:
    runs-on: windows-latest
    needs: windows-quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -e ".[package]"
      - name: Build executable
        shell: pwsh
        run: ./build_windows.ps1
      - name: Smoke-test executable
        run: .\dist\BadgeReliefMaker.exe --help
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BadgeReliefMaker-windows-x64
          path: dist/BadgeReliefMaker.exe
          if-no-files-found: error
