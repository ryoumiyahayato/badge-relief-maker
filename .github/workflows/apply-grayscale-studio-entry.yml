name: Apply grayscale studio entry

on:
  push:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - tools/grayscale_studio_entry.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply desktop entry patch
        shell: bash
        run: |
          git apply --check tools/grayscale_studio_entry.patch
          git apply tools/grayscale_studio_entry.patch
          rm tools/grayscale_studio_entry.patch
          rm .github/workflows/apply-grayscale-studio-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make grayscale studio the default desktop application"
          git push origin "HEAD:${GITHUB_REF_NAME}"
