name: Apply boundary-aware region logic

on:
  push:
    branches:
      - fix/usable-relief-preview-and-mask
    paths:
      - tools/region_logic_full.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply tested region-logic patch
        shell: bash
        run: |
          git apply --check tools/region_logic_full.patch
          git apply tools/region_logic_full.patch
          rm tools/region_logic_full.patch
          rm .github/workflows/apply-region-logic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect boundary-aware line-art region editing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
